name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public files
        run: python scripts/check_public_tree.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run existing offline tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Install and verify the wheel outside the checkout
        run: |
          python -m venv /tmp/duku-wheel-check
          /tmp/duku-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/duku-wheel-check/bin/duku --help
          /tmp/duku-wheel-check/bin/duku download --help
          /tmp/duku-wheel-check/bin/duku listen --help
          /tmp/duku-wheel-check/bin/duku convert --help
          /tmp/duku-wheel-check/bin/python -c "from importlib.resources import files; assert files('duku_assets').joinpath('cover_default.png').is_file()"
