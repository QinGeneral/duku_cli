name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Check public files
        run: uv run --isolated --no-project --python 3.12 python scripts/check_public_tree.py

      - name: Run existing offline tests
        run: uv run --isolated --no-project --python 3.12 --with . python -m unittest discover -s tests -v

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}/dist/duku_cli-"*.whl duku --help
          uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}/dist/duku_cli-"*.whl python -c "from importlib.resources import files; import importlib.metadata as m; assert files('duku_assets').joinpath('cover_default.png').is_file(); print(m.version('duku-cli'))"

      - name: Smoke test source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}/dist/duku_cli-"*.tar.gz duku --help
          uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}/dist/duku_cli-"*.tar.gz python -c "from importlib.resources import files; import importlib.metadata as m; assert files('duku_assets').joinpath('cover_default.png').is_file(); print(m.version('duku-cli'))"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duku-cli/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
